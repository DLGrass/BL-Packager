# Bilup/packager runs dependabot daily against npm. This repository has no
# dependencies at all, so the only thing that can drift is the action versions
# pinned in .github/workflows -- which is what the first entry watches. The npm
# entry stays as a safety net for the day a devDependency appears, at a cadence
# that will not produce empty noise.
#
# Both prefixes are Conventional Commit types, so a bot PR passes the same
# commit-message gate as a human one.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      dependencies:
        patterns:
          - '*'
