# Two jobs and nothing else: build the static site, then publish it to GitHub
# Pages. Everything that used to gate that deploy -- the Node test suite, the
# web UI driven in a real browser, the commit-message check -- is gone from CI
# on request; those checks still exist and still run locally (`pnpm test`,
# `pnpm run ui-check`, and the commit-msg hook installed by `pnpm install`).
#
# One input is deliberately absent from the repository, and the build cannot run
# without it:
#
#   vendor/scaffolding-min.js      the runtime the produced HTML embeds. It is a
#                                  build artifact of TurboWarp's scaffolding and is
#                                  not redistributed here; see README section 4.
#   vendor/scaffolding-addons.js   pointer lock / gamepad / cloud behaviours.
#                                  Optional for a build, but the site should carry
#                                  it so those switches work there.
#
# Pages must be switched to "GitHub Actions" as its source once, in repository
# settings; until then the deploy fails with the message configure-pages prints,
# which is clearer than anything that could be added here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The bundle embeds the runtime, so the build cannot run without it.
      # addons.js is optional in principle (only pointer lock / gamepad / the
      # cloud behaviours need it), but the deployed site should offer those
      # switches rather than reject them at pack time.
      - name: Fetch the runtime scripts that are not redistributed here
        shell: bash
        run: |
          curl -fsSL -o vendor/scaffolding-min.js \
            https://packager.turbowarp.org/scaffolding/scaffolding-min.js
          curl -fsSL -o vendor/scaffolding-addons.js \
            https://packager.turbowarp.org/scaffolding/addons.js
          ls -l vendor/*.js

      # No `version:` -- the action reads packageManager from package.json, which
      # is the whole point of pinning it there.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # There is nothing to download, so this is really a check that the
      # committed pnpm-lock.yaml still matches package.json.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm build:site

      # Fails early with the settings hint if Pages is not on "GitHub Actions".
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy the site
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A deploy that is already publishing should finish; cancelling it midway is
    # how a site ends up half updated.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v5
