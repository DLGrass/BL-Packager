# Native host builds: macOS .app, Linux ELF, Android .apk.
#
# These three cannot be built on a Windows dev box, and they cannot be built in
# the same job either (each needs a different toolchain), so this is the only
# place where "it compiles" is actually true for all three at once.
#
# What each job proves:
#   1. the resources src/pack-app.js writes are what the build script expects;
#   2. the host compiles against that platform's WebView SDK;
#   3. (macOS / Linux) the produced app really loads the project — the host polls
#      the live VM and writes {targets, assets, canvas, ms} to --probe, which is
#      the difference between "it linked" and "it runs".
#
# Android has no runtime check here: an emulator boot costs more than the rest of
# this workflow put together. The APK is built, signed and dumped; installing it
# on a device is the verification step.
#
# One input is not in the repository (see README 4.3): vendor/scaffolding-min.js
# is a TurboWarp build artifact, so every job downloads it.

name: hosts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS .app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Fetch the runtime that is not redistributed here
        run: |
          curl -fsSL -o vendor/scaffolding-min.js \
            https://packager.turbowarp.org/scaffolding/scaffolding-min.js
          ls -l vendor/*.js

      - name: Build a fixture, then the app bundle
        run: |
          node bench/make-project.js
          node src/pack-app.js out/bench/bench.sb3 \
            --target macos --title "BL CI" --name bl-player \
            --probe "$PWD/out/probe.json" --build

      - name: Check the bundle
        run: |
          ls -la hosts/macos/build
          test -x "hosts/macos/build/bl-player.app/Contents/MacOS/bl-player"
          codesign -dv "hosts/macos/build/bl-player.app" 2>&1 | head -5
          du -sh "hosts/macos/build/bl-player.app"

      # The runner has a window server (that is how UI tests work on macOS
      # runners), so the app can be launched for real. Failure here is reported
      # but does not fail the job: a headless runner without an Aqua session
      # cannot run any GUI app, and that is an environment fact, not a code fact.
      - name: Run it and read the live VM back
        continue-on-error: true
        run: |
          rm -f out/probe.json
          "hosts/macos/build/bl-player.app/Contents/MacOS/bl-player" &
          PID=$!
          for _ in $(seq 1 90); do [ -s out/probe.json ] && break; sleep 1; done
          cat out/probe.json || true
          node -e '
            const fs = require("fs");
            const probe = JSON.parse(fs.readFileSync("out/probe.json", "utf8"));
            if (!(probe.targets > 0)) { console.error(probe); process.exit(1); }
            console.log("targets", probe.targets, "assets", probe.assets, "ms", probe.ms);
          '
          kill "$PID" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: bl-player-macos
          path: |
            hosts/macos/build/bl-player.zip
            hosts/macos/build/bl-player.dmg
          if-no-files-found: error

  linux:
    name: Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install GTK3 + WebKit2GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb libgl1 libegl1
          pkg-config --modversion webkit2gtk-4.1

      - name: Fetch the runtime that is not redistributed here
        run: |
          curl -fsSL -o vendor/scaffolding-min.js \
            https://packager.turbowarp.org/scaffolding/scaffolding-min.js

      - name: Build a fixture, then the binary
        run: |
          node bench/make-project.js
          node src/pack-app.js out/bench/bench.sb3 \
            --target linux --title "BL CI" --name bl-player \
            --probe "$PWD/out/probe.json" --build

      - name: Check the binary
        run: |
          ls -la hosts/linux/build
          file hosts/linux/build/bl-player
          du -h hosts/linux/build/bl-player

      # A container has no GPU and no DMABUF, so WebKit's two "smart" rendering
      # paths have to be turned off or the WebProcess dies before the first
      # frame. Both variables are CI-only, not something a packaged app needs.
      - name: Run it under Xvfb and read the live VM back
        run: |
          rm -f out/probe.json
          WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
          LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
            hosts/linux/build/bl-player &
          for _ in $(seq 1 120); do [ -s out/probe.json ] && break; sleep 1; done
          cat out/probe.json || true
          node -e '
            const fs = require("fs");
            const probe = JSON.parse(fs.readFileSync("out/probe.json", "utf8"));
            if (!(probe.targets > 0)) { console.error(probe); process.exit(1); }
            console.log("targets", probe.targets, "assets", probe.assets, "ms", probe.ms);
          '

      - uses: actions/upload-artifact@v7
        with:
          name: bl-player-linux
          path: |
            hosts/linux/build/bl-player
            hosts/linux/build/*.tar.gz
          if-no-files-found: error

  android:
    name: Android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # d8 and apksigner are JVM tools; the runner image already carries a JDK,
      # but pinning it keeps the d8 output class version predictable.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch the runtime that is not redistributed here
        run: |
          curl -fsSL -o vendor/scaffolding-min.js \
            https://packager.turbowarp.org/scaffolding/scaffolding-min.js

      - name: Build a fixture, then the APK
        run: |
          node bench/make-project.js
          node src/pack-app.js out/bench/bench.sb3 \
            --target android --title "BL CI" --name bl-player --build

      - name: Check the APK
        run: |
          ls -la hosts/android/build
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "${BT}aapt2" dump badging hosts/android/build/bl-player-*.apk | head -20
          "${BT}apksigner" verify --print-certs hosts/android/build/bl-player-*.apk | head -6
          du -h hosts/android/build/bl-player-*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: bl-player-android
          path: hosts/android/build/bl-player-*.apk
          if-no-files-found: error
