<svg xmlns="http://www.w3.org/2000/svg" viewBox="154.59911 153.05 53.9 53.9">
  <!--
    Bilup's mark, cropped out of the official lockup (bilup-logo.svg in
    scratch-gui), squared off so the browser does not letterbox it in the tab.
    The fill is hard-coded rather than currentColor: a favicon is its own
    document, so there is no page colour to inherit.
  -->
  <style>
    path { fill: #1f7a7e; }
    /* A dark tab strip is about #292a2d here; the brand teal all but vanishes
       on it, so the lighter tint of the same hue takes over. */
    @media (prefers-color-scheme: dark) { path { fill: #75c1c4; } }
  </style>
